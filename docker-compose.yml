services:
  wheezer:
    build: .
    container_name: wheezer
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8420
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8420/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: &non-image-paths
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.env.example'
      - 'compose.yaml'
      - 'docker-compose.yml'
      - '.github/CODEOWNERS'
      - '.github/labels.json'
      - '.github/workflows/labels.yml'
  pull_request:
    branches: [main]
    paths-ignore: *non-image-paths

# Read-only by default; the publish job asks for what it needs.
permissions:
  contents: read

jobs:
  test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node -c server.js

      # A tag whose version doesn't match package.json produces an image
      # labelled with a version the code doesn't claim. Fail before publishing
      # rather than after.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p 'require("./package.json").version')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag is $GITHUB_REF_NAME but package.json says $pkg_version."
            echo "Bump package.json and move the tag so the two agree."
            exit 1
          fi
          echo "Both are $pkg_version."

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: wheezer:ci

      - name: Smoke test container
        run: |
          docker run -d --name wheezer-ci -p 8420:8420 wheezer:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8420/api/health; then
              echo
              echo "health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "health check failed"
          docker logs wheezer-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f wheezer-ci || true

  publish:
    name: Build & push multi-arch image
    needs: test
    # Publish only from main or a version tag - never from another branch, and
    # never from a pull request, including ones opened from forks. Fork PRs
    # don't get the Docker Hub secrets either way, but be explicit about it.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Gates the job on manual approval. The reviewer list lives on the
    # environment in repo settings, not here - see README.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mrrthr/wheezer
          # A v1.2.3 tag publishes 1.2.3, 1.2 and 1, so you can pin as loosely
          # or as tightly as you want. `latest` still tracks main.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
